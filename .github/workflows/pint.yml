name: pint
permissions:
  contents: read

on:
  push:

jobs:
  phpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite
          tools: composer:v2
      - run: composer install --no-interaction --no-scripts
      - run: vendor/bin/pint --test
